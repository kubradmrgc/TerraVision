name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Test API
        run: dotnet test TerraVision.Api.Tests/TerraVision.Api.Tests.csproj -c Release --verbosity normal

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shared package dependencies
        working-directory: clients/shared
        run: npm ci
      - name: Install and build Next.js client
        working-directory: clients/web-nextjs
        run: |
          npm ci
          npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shared package dependencies
        working-directory: clients/shared
        run: npm ci
      - name: Mobile release gate (typecheck, lint, test)
        working-directory: clients/mobile-react-native
        run: |
          npm ci
          npm run release:check
